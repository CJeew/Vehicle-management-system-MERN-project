# Netlify config (base directory: FRONTEND)
[build]
  command = "npm install --prefix ../BACKEND && CI=false npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  # Frontend calls the backend function on the same site
  REACT_APP_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
